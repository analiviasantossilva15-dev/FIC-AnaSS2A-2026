<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veridia - Registro de Guardiões</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header class="page-header">
      <a href="index.html" class="btn-back">◄ Voltar ao Portal</a>
      <h2>🛡️ Registros dos Guardiões da Aurora</h2>
    </header>

    <form id="playerForm" class="form-box">
      <input type="hidden" id="playerId">
      <input type="text" id="playerName" placeholder="Nome do Guardião" required>
      <select id="playerClass">
        <option value="Guardião da Aurora">Guardião da Aurora</option>
        <option value="Mago Místico">Mago Místico</option>
        <option value="Caçador das Brumas">Caçador das Brumas</option>
      </select>
      <input type="number" id="playerLevel" placeholder="Nível de Essência" min="1" value="1" required>
      <button type="submit" id="btnSave">Consagrar Guardião</button>
    </form>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Guardião</th>
            <th>Ordem</th>
            <th>Essência</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="playerTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="crud.js"></script>
</body>
</html>
