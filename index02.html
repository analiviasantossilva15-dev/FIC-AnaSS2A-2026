<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD de Jogador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header class="page-header">
      <a href="index.html" class="btn-back">◄ Voltar ao Menu</a>
      <h2>👤 Cadastro e Gerenciamento de Jogadores</h2>
    </header>

    <form id="playerForm" class="form-box">
      <input type="hidden" id="playerId">
      <input type="text" id="playerName" placeholder="Nome do Jogador" required>
      <select id="playerClass">
        <option value="Guerreiro">Guerreiro</option>
        <option value="Mago">Mago</option>
        <option value="Arqueiro">Arqueiro</option>
      </select>
      <input type="number" id="playerLevel" placeholder="Nível" min="1" value="1" required>
      <button type="submit" id="btnSave">Salvar Jogador</button>
    </form>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Classe</th>
            <th>Nível</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="playerTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="crud.js"></script>
</body>
</html>
